<!doctype html>
<html lang="en" style="--device-width: 390px; --device-height: 844px">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Responsive device check</title>
    <style>
      * { box-sizing: border-box; }
      html { background: #d8ddd9; font-family: system-ui, sans-serif; }
      body { margin: 0; padding: 22px; }
      header { width: var(--device-width); margin: 0 auto 12px; display: flex; justify-content: space-between; color: #26322f; font-size: 13px; }
      header strong { font-weight: 700; }
      .device { width: calc(var(--device-width) + 2px); height: calc(var(--device-height) + 2px); margin: 0 auto; border: 1px solid #5b6762; background: #fff; overflow: hidden; }
      iframe { width: var(--device-width); height: var(--device-height); border: 0; display: block; }
    </style>
  </head>
  <body>
    <header><strong>iPhone 12</strong><span>390 × 844 CSS px</span></header>
    <div class="device"><iframe title="NEET PG responsive preview" src="/" /></div>
  </body>
</html>
